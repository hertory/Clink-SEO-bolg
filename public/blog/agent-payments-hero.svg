<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ED7039"/>
      <stop offset="100%" stop-color="#EC7193"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.06"/></filter>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 Z" fill="#ED7039"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="#FEFEFB"/>

  <!-- Title -->
  <text x="600" y="65" text-anchor="middle" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#0D1323">AI Agents Need Payments Too</text>
  <text x="600" y="100" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#71717A">The Case for Agent-Native Transaction Infrastructure</text>

  <!-- Flow: Agent -> Protocol -> Transaction -->
  <!-- Agent box (left) -->
  <rect x="70" y="150" width="260" height="140" rx="16" fill="#fff" stroke="#EFEFEF" filter="url(#shadow)"/>
  <!-- Agent icon -->
  <circle cx="200" cy="185" r="22" fill="url(#brand)" opacity=".12"/>
  <text x="200" y="192" text-anchor="middle" font-family="monospace" font-size="20" fill="#ED7039">AI</text>
  <text x="200" y="230" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#0D1323">AI Agent</text>
  <text x="200" y="252" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#71717A">Running tasks autonomously</text>
  <text x="200" y="272" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#71717A">Needs to pay for services</text>

  <!-- Arrow 1 -->
  <line x1="330" y1="220" x2="390" y2="220" stroke="#ED7039" stroke-width="3" marker-end="url(#a)"/>

  <!-- Protocol box (center) -->
  <rect x="400" y="150" width="400" height="140" rx="16" fill="url(#brand)" filter="url(#shadow)"/>
  <text x="600" y="190" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#fff">Clink for Claw</text>
  <text x="600" y="215" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="rgba(255,255,255,.9)">Agent Payment Protocol</text>

  <rect x="440" y="235" width="320" height="24" rx="6" fill="rgba(255,255,255,.15)"/>
  <text x="600" y="252" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="rgba(255,255,255,.85)">Scoped payment capacity + Cryptographic auth + Audit trail</text>

  <text x="600" y="280" text-anchor="middle" font-family="monospace" font-size="10" fill="rgba(255,255,255,.6)">Pre-set limits: $50/day, approved merchants only</text>

  <!-- Arrow 2 -->
  <line x1="800" y1="220" x2="860" y2="220" stroke="#ED7039" stroke-width="3" marker-end="url(#a)"/>

  <!-- Transaction box (right) -->
  <rect x="870" y="150" width="260" height="140" rx="16" fill="#fff" stroke="#EFEFEF" filter="url(#shadow)"/>
  <circle cx="1000" cy="185" r="22" fill="#10B981" opacity=".12"/>
  <text x="1000" y="192" text-anchor="middle" font-family="monospace" font-size="16" fill="#10B981">$</text>
  <text x="1000" y="230" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#0D1323">Transaction</text>
  <text x="1000" y="252" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#71717A">Autonomous payment</text>
  <text x="1000" y="272" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#71717A">Within guardrails</text>

  <!-- Problems section -->
  <text x="600" y="360" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#0D1323">Why Traditional Payments Break for Agents</text>

  <rect x="70" y="390" width="340" height="80" rx="12" fill="#fff" stroke="#EFEFEF" filter="url(#shadow)"/>
  <rect x="70" y="390" width="340" height="34" rx="12" fill="#FEF2F2"/>
  <rect x="70" y="408" width="340" height="16" fill="#FEF2F2"/>
  <text x="240" y="414" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#c0392b">Browser-Dependent</text>
  <text x="100" y="445" font-family="Inter, sans-serif" font-size="12" fill="#71717A">3D Secure, CAPTCHAs, session cookies all require a human at a browser</text>

  <rect x="430" y="390" width="340" height="80" rx="12" fill="#fff" stroke="#EFEFEF" filter="url(#shadow)"/>
  <rect x="430" y="390" width="340" height="34" rx="12" fill="#FEF2F2"/>
  <rect x="430" y="408" width="340" height="16" fill="#FEF2F2"/>
  <text x="600" y="414" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#c0392b">Manual Approval Required</text>
  <text x="460" y="445" font-family="Inter, sans-serif" font-size="12" fill="#71717A">Every transaction waits for human click; breaks autonomous execution</text>

  <rect x="790" y="390" width="340" height="80" rx="12" fill="#fff" stroke="#EFEFEF" filter="url(#shadow)"/>
  <rect x="790" y="390" width="340" height="34" rx="12" fill="#FEF2F2"/>
  <rect x="790" y="408" width="340" height="16" fill="#FEF2F2"/>
  <text x="960" y="414" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#c0392b">No Scoped Permissions</text>
  <text x="820" y="445" font-family="Inter, sans-serif" font-size="12" fill="#71717A">Cannot limit agents to spending caps, merchants, or time windows</text>

  <!-- Solution -->
  <rect x="200" y="510" width="800" height="55" rx="14" fill="url(#brand)" opacity=".08"/>
  <text x="600" y="535" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#ED7039" font-weight="600">Agent-native infrastructure: programmable payments for autonomous AI</text>
  <text x="600" y="555" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#71717A">Clink for Claw - ModelMax and PollyReach already in production</text>

  <text x="600" y="615" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#B8B8BC">Clink - Payment Infrastructure for an AI-Native World</text>
</svg>
