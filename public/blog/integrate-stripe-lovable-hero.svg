<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ED7039"/>
      <stop offset="100%" stop-color="#EC7193"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.06"/></filter>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0 0 L8 3 L0 6 Z" fill="#ED7039"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="#FEFEFB"/>

  <text x="600" y="65" text-anchor="middle" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#0D1323">Integrate Stripe with Lovable</text>
  <text x="600" y="100" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#71717A">Built-in Payments · Legacy Supabase · Go-live checklist</text>

  <!-- Flow steps -->
  <rect x="70" y="160" width="240" height="120" rx="14" fill="#fff" stroke="#EFEFEF" filter="url(#shadow)"/>
  <text x="190" y="210" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#0D1323">1. Enable Payments</text>
  <text x="190" y="240" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#71717A">Pro + Lovable Cloud</text>

  <line x1="310" y1="220" x2="360" y2="220" stroke="#ED7039" stroke-width="3" marker-end="url(#a)"/>

  <rect x="370" y="160" width="240" height="120" rx="14" fill="#fff" stroke="#EFEFEF" filter="url(#shadow)"/>
  <text x="490" y="210" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#0D1323">2. Connect Stripe</text>
  <text x="490" y="240" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#71717A">Sandbox or existing account</text>

  <line x1="610" y1="220" x2="660" y2="220" stroke="#ED7039" stroke-width="3" marker-end="url(#a)"/>

  <rect x="670" y="160" width="240" height="120" rx="14" fill="#fff" stroke="#EFEFEF" filter="url(#shadow)"/>
  <text x="790" y="210" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#0D1323">3. Test in Preview</text>
  <text x="790" y="240" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#71717A">Test cards · webhooks</text>

  <line x1="910" y1="220" x2="960" y2="220" stroke="#ED7039" stroke-width="3" marker-end="url(#a)"/>

  <rect x="970" y="160" width="160" height="120" rx="14" fill="url(#brand)" filter="url(#shadow)"/>
  <text x="1050" y="210" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#fff">4. Go Live</text>
  <text x="1050" y="240" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="rgba(255,255,255,.9)">Claim + publish</text>

  <!-- Two paths note -->
  <rect x="70" y="330" width="520" height="110" rx="12" fill="#fff" stroke="#EFEFEF" filter="url(#shadow)"/>
  <text x="330" y="370" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#0D1323">Built-in Lovable Payments</text>
  <text x="330" y="400" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#71717A">Chat-driven setup · Cloud webhooks · one provider</text>

  <rect x="610" y="330" width="520" height="110" rx="12" fill="#fff" stroke="#EFEFEF" filter="url(#shadow)"/>
  <text x="870" y="370" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#0D1323">Legacy Supabase Path</text>
  <text x="870" y="400" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#71717A">Edge Functions · deploy to test · Restricted keys</text>

  <rect x="250" y="490" width="700" height="50" rx="12" fill="url(#brand)" opacity=".08"/>
  <text x="600" y="520" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#ED7039" font-weight="600">Stripe as processor today  portable infrastructure when one account is not enough</text>

  <text x="600" y="590" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#B8B8BC">Clink - Payment Infrastructure for an AI-Native World</text>
</svg>
