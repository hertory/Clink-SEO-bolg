<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ED7039"/>
      <stop offset="100%" stop-color="#EC7193"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.06"/></filter>
  </defs>

  <rect width="1200" height="630" fill="#FEFEFB"/>

  <text x="600" y="65" text-anchor="middle" font-family="Inter, sans-serif" font-size="26" font-weight="700" fill="#0D1323">Add Payments to a Lovable App</text>
  <text x="600" y="100" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" fill="#71717A">Paddle | Stripe | or portable infrastructure</text>

  <rect x="70" y="160" width="340" height="280" rx="16" fill="#fff" stroke="#EFEFEF" filter="url(#shadow)"/>
  <rect x="70" y="160" width="340" height="52" rx="16" fill="#ED7039"/>
  <rect x="70" y="188" width="340" height="24" fill="#ED7039"/>
  <text x="240" y="195" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#fff">Path A - Paddle</text>
  <text x="240" y="250" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#0D1323">Merchant of Record</text>
  <text x="240" y="280" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#71717A">Global digital goods</text>
  <text x="240" y="305" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#71717A">Tax &amp; compliance handled</text>
  <text x="240" y="340" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#3F3F46">Built-in Lovable payments</text>
  <text x="240" y="375" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#71717A">Best for international SaaS</text>

  <rect x="430" y="160" width="340" height="280" rx="16" fill="#fff" stroke="#EFEFEF" filter="url(#shadow)"/>
  <rect x="430" y="160" width="340" height="52" rx="16" fill="#0D1323"/>
  <rect x="430" y="188" width="340" height="24" fill="#0D1323"/>
  <text x="600" y="195" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#fff">Path B - Stripe</text>
  <text x="600" y="250" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#0D1323">Payment Service Provider</text>
  <text x="600" y="280" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#71717A">Services + digital goods</text>
  <text x="600" y="305" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#71717A">Pay-as-you-go rates</text>
  <text x="600" y="340" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#3F3F46">Built-in or legacy Edge</text>
  <text x="600" y="375" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#71717A">Best for domestic-heavy volume</text>

  <rect x="790" y="160" width="340" height="280" rx="16" fill="#fff" stroke="#EFEFEF" filter="url(#shadow)"/>
  <rect x="790" y="160" width="340" height="52" rx="16" fill="url(#brand)"/>
  <rect x="790" y="188" width="340" height="24" fill="url(#brand)"/>
  <text x="960" y="195" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#fff">Path C - Clink</text>
  <text x="960" y="250" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#0D1323">Payment Infrastructure</text>
  <text x="960" y="280" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#71717A">Portable billing data</text>
  <text x="960" y="305" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#71717A">Multi-PSP routing ready</text>
  <text x="960" y="340" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#3F3F46">clink-integ-skills for agents</text>
  <text x="960" y="375" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#71717A">Best when you outgrow one provider</text>

  <rect x="250" y="490" width="700" height="50" rx="12" fill="url(#brand)" opacity=".08"/>
  <text x="600" y="520" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" fill="#ED7039" font-weight="600">Ship the first dollar in Lovable - graduate the payment layer when it matters</text>

  <text x="600" y="590" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#B8B8BC">Clink - Payment Infrastructure for an AI-Native World</text>
