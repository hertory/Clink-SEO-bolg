<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ED7039"/>
      <stop offset="100%" stop-color="#EC7193"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="2" stdDeviation="8" flood-opacity="0.06"/></filter>
  </defs>

  <rect width="1200" height="630" fill="#FEFEFB"/>

  <!-- Title -->
  <text x="600" y="80" text-anchor="middle" font-family="Inter, sans-serif" font-size="32" font-weight="700" fill="#0D1323">MoR vs PSP</text>
  <text x="600" y="118" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" fill="#71717A">Choosing the Right Payment Infrastructure Model</text>

  <!-- Left Card: MoR -->
  <rect x="80" y="170" width="480" height="380" rx="24" fill="#fff" stroke="#EFEFEF" filter="url(#shadow)"/>
  <rect x="80" y="170" width="480" height="60" rx="24" fill="#ED7039"/>
  <rect x="80" y="206" width="480" height="24" fill="#ED7039"/>
  <text x="320" y="207" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#fff">Merchant of Record</text>

  <!-- MoR items -->
  <text x="130" y="290" font-family="Inter, sans-serif" font-size="14" fill="#0D1323" font-weight="600">Customer -&gt; Payment -&gt; MoR (Legal Seller)</text>
  <line x1="130" y1="305" x2="510" y2="305" stroke="#EFEFEF"/>

  <text x="130" y="335" font-family="Inter, sans-serif" font-size="13" fill="#3F3F46">[+] Tax registered in 60+ jurisdictions</text>
  <text x="130" y="362" font-family="Inter, sans-serif" font-size="13" fill="#3F3F46">[+] Handles chargebacks and disputes</text>
  <text x="130" y="389" font-family="Inter, sans-serif" font-size="13" fill="#3F3F46">[+] Files and remits VAT / GST / Sales Tax</text>
  <text x="130" y="416" font-family="Inter, sans-serif" font-size="13" fill="#3F3F46">[+] One consolidated payout</text>
  <text x="130" y="443" font-family="Inter, sans-serif" font-size="13" fill="#71717A">[-] Higher per-transaction fee (4-7%)</text>
  <text x="130" y="470" font-family="Inter, sans-serif" font-size="13" fill="#71717A">[-] MoR name on invoice</text>

  <!-- Right Card: PSP -->
  <rect x="640" y="170" width="480" height="380" rx="24" fill="#fff" stroke="#EFEFEF" filter="url(#shadow)"/>
  <rect x="640" y="170" width="480" height="60" rx="24" fill="#0D1323"/>
  <rect x="640" y="206" width="480" height="24" fill="#0D1323"/>
  <text x="880" y="207" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#fff">Payment Service Provider</text>

  <!-- PSP items -->
  <text x="690" y="290" font-family="Inter, sans-serif" font-size="14" fill="#0D1323" font-weight="600">Customer -&gt; Payment -&gt; PSP -&gt; You (Merchant)</text>
  <line x1="690" y1="305" x2="1070" y2="305" stroke="#EFEFEF"/>

  <text x="690" y="335" font-family="Inter, sans-serif" font-size="13" fill="#3F3F46">[+] Lower per-transaction fee (2.9% + $0.30)</text>
  <text x="690" y="362" font-family="Inter, sans-serif" font-size="13" fill="#3F3F46">[+] Your brand on invoices and checkout</text>
  <text x="690" y="389" font-family="Inter, sans-serif" font-size="13" fill="#3F3F46">[+] Full control over payment routing</text>
  <text x="690" y="416" font-family="Inter, sans-serif" font-size="13" fill="#3F3F46">[+] Direct merchant relationship</text>
  <text x="690" y="443" font-family="Inter, sans-serif" font-size="13" fill="#71717A">[-] You handle tax registration and filing</text>
  <text x="690" y="470" font-family="Inter, sans-serif" font-size="13" fill="#71717A">[-] Liability for disputes and compliance</text>

  <!-- Connector -->
  <line x1="560" y1="360" x2="640" y2="360" stroke="#EFEFEF" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="600" y="355" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#71717A">OR</text>

  <!-- Bottom label -->
  <text x="600" y="570" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#B8B8BC">Clink - Payment Infrastructure for an AI-Native World</text>
</svg>
